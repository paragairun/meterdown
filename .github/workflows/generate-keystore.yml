name: Generate Release Keystore (one-time, run once only)

# Generates a real Android release keystore entirely on GitHub's own
# runner, since keytool (part of any JDK) isn't installed on your
# local machine and you'd rather not install one. Passwords are
# randomly generated by this workflow itself - never typed by you,
# never printed in any log - and everything comes back to you as a
# single downloadable artifact.
#
# RUN THIS EXACTLY ONCE. After you've downloaded the result and saved
# the 4 values as GitHub Secrets, delete this workflow run (Actions ->
# this run -> "..." -> Delete workflow run) so the keystore file stops
# existing anywhere on GitHub's servers. From that point on, the
# ANDROID_KEYSTORE_BASE64 secret is the only copy of it that matters.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21 (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Generate keystore with strong random passwords
        run: |
          STORE_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)

          keytool -genkey -v \
            -keystore metersahi-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias metersahi \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=MeterSahi, OU=MeterSahi, O=MeterSahi, L=Mumbai, ST=Maharashtra, C=IN"

          # These 4 values are exactly what go into the 4 GitHub
          # Secrets - written to a file, never echoed to the log.
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=metersahi"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } > keystore-credentials.txt

          base64 -w0 metersahi-release.jks > keystore-base64.txt

      - name: Upload keystore + credentials as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD-THEN-DELETE-THIS-RUN
          path: |
            metersahi-release.jks
            keystore-credentials.txt
            keystore-base64.txt
          retention-days: 1
