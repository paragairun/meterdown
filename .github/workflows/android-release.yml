name: Build Signed Release AAB

# Builds a release .aab, then signs it DIRECTLY with jarsigner as an
# explicit step - not through Gradle's signingConfig mechanism, which
# was the source of an unresolved bug: the keystore was correctly
# available to Gradle, but never actually got applied to the
# bundleRelease task. This sidesteps that entirely by taking direct
# control of signing instead of relying on Gradle to do it internally.
#
# No Play Console upload, no service account. You download the signed
# .aab from this run's Artifacts and upload it to Play Console
# yourself.
#
# Manual trigger only (workflow_dispatch).
#
# ─────────────────────────────────────────────────────────────────
# ONE-TIME SETUP - same 4 secrets as before, nothing new needed:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (repo Settings -> Secrets and variables -> Actions)
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Verify keystore actually decoded to something real
        run: |
          echo "Decoded keystore file size (should NOT be 0):"
          ls -la android/app/release.jks
          FILESIZE=$(stat -c%s android/app/release.jks 2>/dev/null || stat -f%z android/app/release.jks)
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::release.jks is suspiciously small ($FILESIZE bytes) - ANDROID_KEYSTORE_BASE64 is probably empty or wrong."
            exit 1
          fi
          echo "Keystore looks real ($FILESIZE bytes)."

      - name: Build release bundle (.aab) - unsigned at this point, signed in the next step
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: List the actual alias(es) in the keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Aliases actually present in android/app/release.jks:"
          keytool -list -keystore android/app/release.jks -storepass "$STORE_PASS"
          echo ""
          echo "Compare the alias name above against your ANDROID_KEY_ALIAS secret's value."
          echo "Also confirm the entry type says 'PrivateKeyEntry', not 'trustedCertEntry' -"
          echo "jarsigner needs a private key entry specifically, not just a certificate."

      - name: Sign the .aab directly with jarsigner
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::One of ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD is empty. Check these secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_PATH" \
            "$KEY_ALIAS"

      - name: Verify the .aab is ACTUALLY signed
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if ! jarsigner -verify "$AAB_PATH" > /tmp/jarsigner-output.txt 2>&1; then
            echo "::error::The .aab is still not signed after the explicit jarsigner step. Something is genuinely wrong with the keystore/credentials."
            cat /tmp/jarsigner-output.txt
            exit 1
          fi
          echo "Confirmed: .aab is genuinely signed."
          cat /tmp/jarsigner-output.txt

      - name: Clean up decoded keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload signed AAB as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: metersahi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

# ─────────────────────────────────────────────────────────────────
# TO ACTUALLY PUBLISH: download the .aab from this run's Artifacts
# section, then go to Play Console -> your app -> Testing (or
# Production) -> Create new release -> upload it there directly.
# ─────────────────────────────────────────────────────────────────
