name: Build Signed Release AAB

# Builds a SIGNED release .aab and makes it available as a downloadable
# artifact - no Play Console upload, no service account needed. You
# download the file from this workflow's run page and upload it to
# Play Console yourself, whenever and however you choose.
#
# Manual trigger only (workflow_dispatch) - a signed release build
# should be a deliberate action, not something that happens on every
# push to main.
#
# ─────────────────────────────────────────────────────────────────
# ONE-TIME SETUP REQUIRED - just the keystore, nothing Play-Console-
# related:
#
# 1. Generate a release keystore once, locally (any JDK, no Android
#    Studio needed):
#      keytool -genkey -v -keystore metersahi-release.jks \
#        -keyalg RSA -keysize 2048 -validity 10000 -alias metersahi
#    STORE THIS FILE SAFELY, OUTSIDE GIT. If you lose it, you can
#    never update an already-published app under the same signature.
#
# 2. Add these 4 GitHub Secrets (repo Settings -> Secrets and
#    variables -> Actions -> New repository secret):
#      ANDROID_KEYSTORE_BASE64   = output of: base64 -w0 metersahi-release.jks
#      ANDROID_KEYSTORE_PASSWORD = the keystore password you set in step 1
#      ANDROID_KEY_ALIAS         = metersahi (or whatever alias you used)
#      ANDROID_KEY_PASSWORD      = the key password you set in step 1
#
# That's it - no Play Console service account, no Play Console setup
# at all required for this workflow to work.
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Write keystore.properties (never committed - generated fresh each run)
        run: |
          cat > android/app/keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify keystore actually decoded to something real
        run: |
          echo "Decoded keystore file size (should NOT be 0):"
          ls -la android/app/release.jks
          FILESIZE=$(stat -c%s android/app/release.jks 2>/dev/null || stat -f%z android/app/release.jks)
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::release.jks is suspiciously small ($FILESIZE bytes) - ANDROID_KEYSTORE_BASE64 is probably empty or wrong. Check the secret's value in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Checking keystore.properties has non-empty values (not printing the actual secret values):"
          for field in storeFile storePassword keyAlias keyPassword; do
            VALUE=$(grep "^${field}=" android/app/keystore.properties | cut -d= -f2)
            if [ -z "$VALUE" ]; then
              echo "::error::keystore.properties field '${field}' is empty - the corresponding GitHub Secret is probably not set."
              exit 1
            fi
          done
          echo "All keystore fields present and non-empty."

      - name: Build signed release bundle (.aab)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify the .aab is ACTUALLY signed (not just that the keystore was available)
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          echo "Checking $AAB_PATH for a real signature..."
          if ! jarsigner -verify "$AAB_PATH" > /tmp/jarsigner-output.txt 2>&1; then
            echo "::error::The built .aab is NOT signed, even though the keystore was successfully decoded and populated earlier in this run. This means Gradle picked up the keystore config but did not apply it to the bundleRelease task - a deeper Android Gradle Plugin issue, not a missing-secret problem."
            cat /tmp/jarsigner-output.txt
            exit 1
          fi
          echo "Confirmed: .aab is genuinely signed."
          cat /tmp/jarsigner-output.txt

      - name: Clean up decoded keystore
        if: always()
        run: rm -f android/app/release.jks android/app/keystore.properties

      - name: Upload signed AAB as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: metersahi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

# ─────────────────────────────────────────────────────────────────
# TO ACTUALLY PUBLISH: download the .aab from this run's Artifacts
# section, then go to Play Console -> your app -> Testing (or
# Production) -> Create new release -> upload it there directly.
# Same manual process every time, fully under your control - no
# automated upload, no service account, nothing to misconfigure on
# that front ever again.
# ─────────────────────────────────────────────────────────────────
