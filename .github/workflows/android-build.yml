name: Build Android APK

# Builds a debug APK entirely on GitHub's hosted runners - no local
# Android Studio needed. A debug build is auto-signed by the Android
# Gradle Plugin with a well-known, non-secret debug key, which is
# exactly what you want for sideloading onto your own phone to test.
# It is NOT suitable for a Play Store release - see the note at the
# bottom of this file for what changes when you're ready for that.

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: # lets you trigger a build manually from the Actions tab, no push needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (copies config + web assets into the native project)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: metersahi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

# ─────────────────────────────────────────────────────────────────
# FOR PLAY STORE RELEASES:
# See .github/workflows/android-release.yml - a separate, manual-only
# workflow that builds a signed release bundle and uploads it to Play
# Console. Deliberately kept separate from this file: this one runs
# automatically on every push (fine, it's just a test build); that one
# only ever runs when you explicitly trigger it (as it should, for
# anything that touches your real Play Store listing).
# ─────────────────────────────────────────────────────────────────
