apply plugin: 'com.android.application'

android {
    namespace = "in.metersahi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.metersahi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing - reads from keystore.properties, which is
    // NEVER committed to the repo (see android/.gitignore). Locally,
    // you'd create this file yourself pointing at your own keystore.
    // In CI, the release workflow generates it fresh from GitHub
    // Secrets on every run, then discards it when the job ends.
    //
    // IMPORTANT: if you're building a RELEASE task (bundleRelease,
    // assembleRelease) and this file is missing, the build now FAILS
    // LOUDLY instead of silently producing an unsigned bundle. The
    // previous version of this file didn't do that - it silently
    // skipped signing whenever the file wasn't found, which is
    // exactly how an unsigned .aab got uploaded to Play Console
    // without any error until Play Store itself rejected it days
    // later. Debug builds are completely unaffected either way - this
    // check only fires for release-related tasks.
    def keystorePropertiesFile = rootProject.file("app/keystore.properties")
    def keystoreProperties = new Properties()
    def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    def hasSigningConfig = keystorePropertiesFile.exists()

    if (hasSigningConfig) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    } else if (isReleaseTask) {
        throw new GradleException(
            "Building a RELEASE bundle/APK requires android/app/keystore.properties to " +
            "exist (with storeFile/storePassword/keyAlias/keyPassword) but it was not " +
            "found. This file is never committed to the repo - in CI it must be generated " +
            "fresh from GitHub Secrets before this build step runs (see the 'Write " +
            "keystore.properties' step in .github/workflows/android-release.yml). If " +
            "you're building locally, you need to create this file yourself, pointing at " +
            "your own release keystore."
        )
    }

    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
